# =============================================================================
# UDC Enterprise Platform — Nginx Reverse Proxy Configuration
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Upstream definitions
    upstream classifier {
        server classifier:8080;
    }

    upstream metacatalog {
        server metacatalog:8001;
    }

    upstream contextvault {
        server contextvault:8002;
    }

    upstream visionlens {
        server visionlens:8003;
    }

    upstream desktopagent {
        server desktopagent:8004;
    }

    upstream policyguard {
        server policyguard:8005;
    }

    upstream orchestrator {
        server orchestrator:8006;
    }

    upstream portal {
        server portal:3000;
    }

    server {
        listen 80;
        server_name _;

        # Health check
        location /nginx-health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # UDC Classifier (.NET)
        location /api/classify {
            proxy_pass http://classifier;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/pipeline {
            proxy_pass http://classifier;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/dashboard {
            proxy_pass http://classifier;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/quality {
            proxy_pass http://classifier;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # UDC MetaCatalog
        location /api/meta/ {
            proxy_pass http://metacatalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # UDC ContextVault
        location /api/context/ {
            proxy_pass http://contextvault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # UDC VisionLens
        location /api/vision/ {
            proxy_pass http://visionlens/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # UDC DesktopAgent
        location /api/desktop/ {
            proxy_pass http://desktopagent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # UDC PolicyGuard
        location /api/policy/ {
            proxy_pass http://policyguard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # UDC Orchestrator (gateway)
        location /api/workflow {
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/chat {
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Frontend (portal)
        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # WebSocket for Vite HMR in dev
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

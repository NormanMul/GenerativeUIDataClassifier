[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udc-policyguard"
version = "0.1.0"
description = "UDC PolicyGuard — Governance, policy enforcement, and audit service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "httpx",
    "structlog",
    "grpcio",
    "grpcio-tools",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "mypy",
]

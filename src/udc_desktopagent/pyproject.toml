[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udc-desktopagent"
version = "0.1.0"
description = "UDC DesktopAgent — Containerized desktop automation agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "openai>=1.12.0",
    "Pillow>=10.2.0",
    "pyautogui>=0.9.54",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
